[project]
name = "trading-journal"
version = "0.1.0"
description = "Trading journal + behavior analysis app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django==5.2.*",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
