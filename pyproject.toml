[project]
name = "trading-journal"
version = "0.1.0"
description = "Trading journal + behavior analysis app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django==5.2.*",
    "psycopg[binary]>=3.2",
    # zoneinfo.available_timezones() (accounts/models.py) needs an IANA database; slim
    # containers and Windows have none in the OS.
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/", "static/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
# Asserts and hardcoded test passwords are fine in tests.
"test_*.py" = ["S"]
"tests.py" = ["S"]
"**/test_*.py" = ["S"]
# S105 false positive: user-facing error copy whose constant names contain "PASSWORD".
"accounts/copy.py" = ["S105"]
# Pre-existing QA/page tests with long assertion messages and test names; not rewrapped.
"accounts/test_auth_qa.py" = ["E501"]
"config/test_pages.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "journal", "config"]
