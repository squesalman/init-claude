{# EmptyState (design 5.4 A and B): all copy and the one link come from the view. #}
<section aria-labelledby="empty-title" class="card mt-6 sm:p-8">
  <h2 id="empty-title" class="text-lg font-semibold">{{ empty_heading }}</h2>
  <p class="mt-2 text-text-muted">{{ empty_body }}</p>
  <a href="{{ empty_url }}" class="btn-primary mt-6 w-full sm:w-auto">{{ empty_action }}</a>
</section>
