{# EmptyState (design 5.4 A and B): copy and the primary link come from the view; the secondary Add trade link is a constant (docs/design/manual-entry.md 3.2). #}
<section aria-labelledby="empty-title" class="card mt-6 sm:p-8">
  <h2 id="empty-title" class="text-lg font-semibold">{{ empty_heading }}</h2>
  <p class="mt-2 text-text-muted">{{ empty_body }}</p>
  <div class="mt-6 flex flex-wrap gap-3"><a href="{{ empty_url }}" class="btn-primary w-full sm:w-auto">{{ empty_action }}</a><a href="{% url 'trade_add' %}" class="btn-secondary w-full sm:w-auto">{{ copy.ADD_TRADE }}</a></div>
</section>
